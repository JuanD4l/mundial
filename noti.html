<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noticias - FIFA World Cup 2026</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/p.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">FIFA WORLD CUP 2026</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="grupos.html">Grupos</a></li>
                    <li class="nav-item"><a class="nav-link" href="calendario.html">Calendario</a></li>
                    <li class="nav-item"><a class="nav-link" href="esta.html">Estadísticas</a></li>
                    <li class="nav-item"><a class="nav-link" href="noti.html">Noticias</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5 pt-5">
        <h1 class="text-center mb-5 display-5 fw-bold">Noticias del Mundial 2026</h1>

        <!-- Buscador -->
        <div class="row mb-5">
            <div class="col-md-8 mx-auto">
                <div class="input-group input-group-lg">
                    <span class="input-group-text"><i class="bi bi-search"></i></span>
                    <input type="text" id="search-news" class="form-control" placeholder="Buscar noticias...">
                </div>
            </div>
        </div>

        <!-- Contenido de noticias -->
        <div id="news-container" class="row g-4"></div>
    </div>

    <!-- Modal Detalle -->
    <div class="modal fade" id="newsModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modal-title"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <img id="modal-image" class="img-fluid rounded mb-4" style="width:100%; max-height:400px; object-fit:cover;">
                    <p id="modal-date" class="text-muted mb-3"></p>
                    <div id="modal-content"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>
  <footer class="bg-dark text-white py-5 mt-5">
        <div class="container text-center">
            <p>&copy; 2026 FIFA World Cup • Proyecto con HTML, CSS y JavaScript</p>
        </div>
    </footer>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="/js/datos.js"></script>
    <script src="/js/noticias.js"></script>
</body>
</html>
